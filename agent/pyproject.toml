[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcing-agent"
version = "0.1.0"
description = "Evidence-grounded supplier research with a bounded agent harness"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
live = ["anthropic>=0.49,<3", "openai>=2,<3"]
graph = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4"]
mcp = ["mcp>=2.3,<3", "jsonschema>=4.23,<5"]
database = ["pymssql>=2.4.6,<3"]
dev = ["ruff>=0.11,<1"]

[project.scripts]
sourcing-agent = "sourcing_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sourcing_agent*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["sourcing_agent"]
